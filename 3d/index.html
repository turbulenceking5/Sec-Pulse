<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sec-Pulse 3D</title>
<style>
  :root { --bg: #0d1117; --fg: #e6edf3; --muted: #8b949e; --accent: #2f81f7; --chip: #161b22; --line: #30363d; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: max(12px, env(safe-area-inset-top)) 16px 12px; }
  header a { color: var(--muted); text-decoration: none; }
  h1 { font-size: 17px; margin: 0; flex: 1; }
  #scene { flex: 1; width: 100%; min-height: 0; display: block; touch-action: none; }
  nav { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px max(12px, env(safe-area-inset-bottom)); }
  button { font: inherit; color: var(--fg); background: var(--chip); border: 1px solid var(--line);
    border-radius: 999px; padding: 8px 14px; cursor: pointer; }
  button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); }
  #picker { display: contents; }
  #export { margin-left: auto; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<header>
  <a href="../" aria-label="Back to Sec-Pulse">‹ Sec-Pulse</a>
  <h1>3D models</h1>
</header>
<canvas id="scene"></canvas>
<nav>
  <div id="picker"></div>
  <button id="export" title="Download the current model as a .glb file">⬇ .glb</button>
</nav>
<script type="module" src="dist/main.js"></script>
</body>
</html>
