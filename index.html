<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sec-Pulse</title>
<meta name="description" content="Personal cyber security news brief and CySA+ study app">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sec-Pulse">
<link rel="manifest" href="manifest.json?v=1">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png?v=1">
<link rel="icon" href="assets/icons/icon-192.png?v=1">
<script>
// Theme before first paint (no flash). sp_theme: "system" (default) | "dark" | "light". Re-run by the Settings picker.
(function(){
  var mq = window.matchMedia ? matchMedia('(prefers-color-scheme: light)') : null;
  function apply(){
    var p = null; try{ p = JSON.parse(localStorage.getItem('sp_theme')); }catch(e){}
    var t = p === 'light' || p === 'dark' ? p : (mq && mq.matches ? 'light' : 'dark');
    document.documentElement.setAttribute('data-theme', t);
    var m = document.querySelector('meta[name=theme-color]'); if (m) m.setAttribute('content', t === 'light' ? '#f3f6fa' : '#0b1220');
    // iOS reads this at launch: dark text on a light status bar in light mode (takes effect next time the app opens).
    var s = document.querySelector('meta[name=apple-mobile-web-app-status-bar-style]'); if (s) s.setAttribute('content', t === 'light' ? 'default' : 'black-translucent');
    return t;
  }
  window.applyTheme = apply; apply();
  if (mq){ try{ mq.addEventListener('change', apply); }catch(e){ try{ mq.addListener(apply); }catch(e2){} } }
})();
</script>
<style>
:root{
  --bg:#0b1220; --surface:#121c2e; --surface2:#17243a; --border:#22314a;
  --text:#e6edf7; --muted:#8da2c0; --accent:#38e1c8; --accent-dim:rgba(56,225,200,.14); --accent-line:rgba(56,225,200,.4);
  --warn:#f5b84b; --danger:#ff6b6b; --ok:#5ad08a; --au:#f5b84b;
  --warn-dim:rgba(245,184,75,.1); --warn-line:rgba(245,184,75,.42); --danger-dim:rgba(255,107,107,.12); --danger-line:rgba(255,107,107,.42);
  --ok-dim:rgba(90,208,138,.12); --on-accent:#06221d; --glass:rgba(11,18,32,.94);
  --radius:14px; --nav-h:62px; color-scheme:dark;
}
/* Light theme: set on <html data-theme="light"> by the head script (System follows prefers-color-scheme). */
:root[data-theme=light]{
  --bg:#f3f6fa; --surface:#ffffff; --surface2:#eaf0f6; --border:#d3dce8;
  --text:#0f1b2d; --muted:#53647c; --accent:#077a6b; --accent-dim:rgba(7,122,107,.1); --accent-line:rgba(7,122,107,.45);
  --warn:#9a5b00; --danger:#c42b2b; --ok:#1d7f45; --au:#9a5b00;
  --warn-dim:rgba(154,91,0,.08); --warn-line:rgba(154,91,0,.4); --danger-dim:rgba(196,43,43,.08); --danger-line:rgba(196,43,43,.4);
  --ok-dim:rgba(29,127,69,.1); --on-accent:#ffffff; --glass:rgba(243,246,250,.94); color-scheme:light;
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 12px);min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
header{position:sticky;top:0;z-index:20;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;letter-spacing:.3px;flex:1;display:flex;align-items:center;gap:8px}
header h1 img{width:26px;height:26px;border-radius:7px}
#updated{font-size:12px;color:var(--muted)}
.icon-btn{background:none;border:0;padding:6px;border-radius:10px;color:var(--muted);display:flex}
.icon-btn:active{background:var(--surface2)}
main{max-width:720px;margin:0 auto;padding:14px 16px}
.view{display:none}.view.active{display:block}
h2{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:22px 0 10px;font-weight:600}
h2:first-child{margin-top:4px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}.small{font-size:13px}
.pill{display:inline-flex;align-items:center;gap:5px;background:var(--surface2);border:1px solid var(--border);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--muted);white-space:nowrap}
.pill.accent{color:var(--accent);border-color:var(--accent-line);background:var(--accent-dim)}
.pill.au{color:var(--au);border-color:var(--warn-line);background:var(--warn-dim)}
.pill.danger{color:var(--danger);border-color:var(--danger-line);background:var(--danger-dim)}
.btn{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:10px 14px;font-weight:600}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.block{width:100%;display:block;text-align:center}
.btn:disabled{opacity:.45}
.greet{font-size:22px;font-weight:700;margin:2px 0 2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px;line-height:1.2}
.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}

/* news */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:6px 13px;font-size:13px;color:var(--muted)}
.chip.on{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
.search{width:100%;margin:10px 0 12px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 12px;color:var(--text);font:inherit}
.news-item{position:relative}
.news-item.read{opacity:.62}
.news-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-bottom:5px}
.news-title{font-weight:600;font-size:15.5px;line-height:1.35;text-decoration:none;color:var(--text);display:block}
.news-sum{font-size:13.5px;color:var(--muted);margin:6px 0 0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tag{font-size:11px;padding:2px 8px;border-radius:6px;background:var(--surface2);color:var(--muted);border:1px solid var(--border)}
.tag.hot{color:var(--danger);border-color:var(--danger-line)}
.tag.re{color:var(--accent);border-color:var(--accent-line)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.save-btn{position:absolute;top:10px;right:8px;background:none;border:0;padding:6px;color:var(--muted)}
.save-btn.on{color:var(--warn)}
.score{font-variant-numeric:tabular-nums}
.empty{text-align:center;color:var(--muted);padding:30px 10px}

/* learn */
.bar{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.lesson-row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--border);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.lesson-row:last-child{border-bottom:0}
.check{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);flex:none;display:flex;align-items:center;justify-content:center;font-size:13px}
.check.done{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.lesson-id{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;min-width:34px;flex:none}
.box{border-radius:12px;padding:12px;margin:12px 0;font-size:14px}
.box.tip{background:var(--accent-dim);border:1px solid var(--accent-line)}
.box.job{background:var(--warn-dim);border:1px solid var(--warn-line)}
.box b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px}
.box.tip b{color:var(--accent)}.box.job b{color:var(--warn)}
.points{padding-left:18px;margin:8px 0}.points li{margin-bottom:8px}

/* quiz */
.q-text{font-weight:600;margin:4px 0 12px}
.opt{display:block;width:100%;text-align:left;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:11px 12px;margin-bottom:8px}
.opt.correct{border-color:var(--ok);background:var(--ok-dim)}
.opt.wrong{border-color:var(--danger);background:var(--danger-dim)}
.opt:disabled{cursor:default;color:var(--text)}
.explain{font-size:13.5px;color:var(--muted);margin:4px 0 12px}
.q-progress{font-size:12px;color:var(--muted);margin-bottom:6px}

/* cards */
.flash{min-height:220px;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:24px 18px}
.flash .front,.flash-front{font-size:21px;font-weight:700}
.flash-front{text-align:center;padding:6px 0 2px}
.flash .back{font-size:15.5px;margin-top:16px;color:var(--text);border-top:1px solid var(--border);padding-top:16px}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grade .btn{padding:12px 6px}
.boxes{display:flex;gap:6px;margin-top:10px}
.boxes div{flex:1;text-align:center;background:var(--surface2);border-radius:8px;padding:6px 0;font-size:12px;color:var(--muted)}
.boxes b{display:block;color:var(--text);font-size:15px}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-top:1px solid var(--border);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 0;position:relative}
nav button.on{color:var(--accent)}
nav svg{width:24px;height:24px}
.badge{position:absolute;top:0;left:calc(50% + 6px);background:var(--danger);color:#fff;font-size:10px;font-weight:700;border-radius:99px;padding:0 5px;min-width:16px;line-height:16px}

/* sheet */
#sheet{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;display:none;-webkit-overflow-scrolling:touch}
#sheet.open{display:block}
#sheet-head{position:sticky;top:0;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--border);
  padding:calc(10px + env(safe-area-inset-top)) 12px 10px;display:flex;align-items:center;gap:8px;z-index:2}
#sheet-title{font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sheet-body{max-width:720px;margin:0 auto;padding:16px 16px calc(40px + env(safe-area-inset-bottom))}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px);background:var(--surface2);border:1px solid var(--accent);
  color:var(--text);padding:9px 16px;border-radius:12px;z-index:80;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px)}
#toast.show{opacity:1}
#install-hint{display:none}
table{width:100%;border-collapse:collapse;font-size:13px}
td{padding:6px 4px;border-bottom:1px solid var(--border);vertical-align:top}
/* exam countdown, why-ranked, mutes, optional news fields */
.exam-card{gap:14px;width:100%;text-align:left}
.exam-days{flex:none;text-align:center;min-width:64px;border-right:1px solid var(--border);padding-right:12px}
.exam-days b{display:block;font-size:26px;line-height:1.1;color:var(--accent);font-variant-numeric:tabular-nums}
.exam-days span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
button.pill{font-size:12px}
.pill.unmute{white-space:normal;text-align:left;max-width:100%}
.why{cursor:pointer}
.tags.why{background:none;border:0;padding:0;text-align:left}
.also-btn{background:none;border:0;padding:0;margin-top:8px;font-size:12.5px;color:var(--accent)}
.also-list{margin:6px 0 0;padding-left:18px;font-size:13px}
.also-list li{margin-bottom:4px;overflow-wrap:anywhere}
.linkish{background:none;border:0;padding:0;color:var(--accent);font-size:inherit}
.field{width:100%;min-width:0;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:9px 12px;color:var(--text);font:inherit}
.wrap{flex-wrap:wrap}
.mute-note{margin:-4px 0 10px}
code{background:var(--surface2);padding:1px 6px;border-radius:6px;font-size:13px;word-break:break-all}
/* refresh spinner */
.icon-btn.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* XP / analyst rank */
.rank-card{width:100%;text-align:left;gap:12px;margin-top:12px}
.rank-badge{flex:none;width:48px;height:48px;border-radius:12px;background:var(--accent-dim);border:1px solid var(--accent-line);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.rank-badge b{font-size:19px;color:var(--accent);font-variant-numeric:tabular-nums}
.rank-badge span{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-top:2px}
.rank-badge.big{width:72px;height:72px}.rank-badge.big b{font-size:30px}
.xp{color:var(--accent);font-weight:700;font-size:12.5px;white-space:nowrap}
.skill{margin-bottom:12px}.skill:last-child{margin-bottom:0}
.ladder td{padding:7px 4px}.ladder tr.here td{color:var(--accent);font-weight:700}.ladder tr.locked td{color:var(--muted)}
/* changelog / roadmap */
.md h3{font-size:15px;margin:18px 0 6px}.md h3:first-child{margin-top:0}
.md ul{padding-left:18px;margin:6px 0}.md li{margin-bottom:6px}
.md li.todo,.md li.done{list-style:none;margin-left:-18px}
.md li.done{color:var(--muted)}
.links{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.links a{text-decoration:none}
/* PBQs: exhibit scrolls inside its own box, never the page */
.exhibit{margin:0 0 12px;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--surface2);border:1px solid var(--border);border-radius:10px;
  padding:10px 12px;font:12.5px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre;color:var(--text)}
.order-list{list-style:none;margin:0 0 10px;padding:0}
.order-item{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:6px 6px 6px 10px;margin-bottom:8px}
.order-item.correct{border-color:var(--ok);background:var(--ok-dim)}.order-item.wrong{border-color:var(--danger);background:var(--danger-dim)}
.order-item .n{flex:none;width:22px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.order-item .t{flex:1;min-width:0;overflow-wrap:anywhere}
.mv{flex:none;width:40px;height:40px;border-radius:10px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:15px}
.mv:disabled{opacity:.3}
.scaled{margin-top:14px;padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--surface2);text-align:center}
.scaled b{font-size:24px;font-variant-numeric:tabular-nums}
/* daily quests */
.quest{display:block;width:100%;background:none;border:0;padding:0;text-align:left;margin-bottom:10px}
.quest.done .grow{color:var(--muted);text-decoration:line-through}
.bar.thin{height:4px;margin-top:5px}.quest.done .bar i{background:var(--ok)}
/* pull to refresh */
#ptr{height:0;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;gap:8px;font-size:13px;color:var(--muted)}
#ptr.anim{transition:height .2s}
#ptr svg{width:18px;height:18px;margin-bottom:12px;transition:transform .15s}
#ptr span{margin-bottom:12px}
#ptr.ready svg{transform:rotate(180deg)}#ptr.busy svg{animation:spin .8s linear infinite}
html.ptr-on{overscroll-behavior-y:contain}
/* read later + notes */
.later-btn{position:absolute;top:10px;right:40px;background:none;border:0;padding:6px;color:var(--muted);display:flex}
.later-btn.on{color:var(--accent)}
.later-btn svg{width:18px;height:18px}
.news-item .news-meta{padding-right:66px}
.note{margin-top:10px;padding:8px 10px;border-left:3px solid var(--warn);background:var(--warn-dim);border-radius:6px;font-size:13.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.note-edit textarea{width:100%;min-height:70px;resize:vertical;margin-top:10px}
/* achievements, heatmap, accuracy trend, focus + backup cards, CVE links */
.badges{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.badge-tile{display:flex;gap:8px;align-items:flex-start;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:8px 10px;font-size:12.5px;line-height:1.35}
.badge-tile .ic{font-size:20px;line-height:1.1;flex:none}
.badge-tile.locked{opacity:.5}.badge-tile.locked .ic{filter:grayscale(1)}
.badge-tile b{display:block;font-size:13px}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:3px}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--surface2)}
.heat i.l1,.heat i.l2,.heat i.l3,.heat i.l4,.heat-key i.l1,.heat-key i.l2,.heat-key i.l3,.heat-key i.l4{background:var(--accent)}
.heat i.l1,.heat-key i.l1{opacity:.3}.heat i.l2,.heat-key i.l2{opacity:.5}.heat i.l3,.heat-key i.l3{opacity:.75}
.heat i.fz{outline:1px dashed var(--accent);outline-offset:-1px}
.heat i.future{visibility:hidden}
.heat-key{display:flex;align-items:center;gap:3px;justify-content:flex-end;margin-top:8px;font-size:11px;color:var(--muted)}
.heat-key i{width:10px;height:10px;border-radius:2px;background:var(--surface2);display:inline-block}
.trend{width:100%;height:auto;display:block}
.focus-card{width:100%;text-align:left;gap:12px}
#today-brief .news-sum{display:block;-webkit-line-clamp:unset;overflow:visible}
.event{display:flex;gap:12px;align-items:flex-start}
.event-date{flex:none;width:48px;text-align:center;border-radius:10px;background:var(--surface2);border:1px solid var(--border);padding:5px 0;line-height:1.15}
.event-date b{display:block;font-size:18px}.event-date span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.event.near .event-date{background:var(--accent-dim);border-color:var(--accent-line)}.event.near .event-date b{color:var(--accent)}
.cves{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.cves a{text-decoration:none;color:var(--accent);border-color:var(--accent-line)}
.seg{display:flex;gap:6px}.seg .btn{flex:1;padding:9px 6px}.seg .btn.on{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
</style>
</head>
<body>
<header>
  <h1><img src="assets/icons/icon-192.png?v=1" alt="">Sec-Pulse</h1>
  <span id="updated"></span>
  <button class="icon-btn" id="refresh-btn" aria-label="Refresh news"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>

<script>
'use strict';
/* ---------- storage (per-device, wrapped so private mode never breaks the app) ---------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem('sp_'+k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('sp_'+k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem('sp_'+k); }catch(e){} }
};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2200); }

/* ---------- dates: everything keyed to Brisbane time (no daylight saving) ---------- */
const TZ = 'Australia/Brisbane';
function todayKey(d = new Date()){ return new Intl.DateTimeFormat('en-CA', {timeZone: TZ}).format(d); }
function addDays(key, n){ const d = new Date(key + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
// Same as Python's date.toordinal(), so the app and the morning notification pick the same lesson.
function ordinal(key){ return Math.floor(Date.parse(key + 'T00:00:00Z') / 864e5) + 719163; }
function brisHour(){ return +new Intl.DateTimeFormat('en-AU', {timeZone: TZ, hour: 'numeric', hourCycle: 'h23'}).format(new Date()); }
function ago(iso){
  const m = Math.max(0, (Date.now() - Date.parse(iso)) / 6e4);
  if (m < 60) return Math.round(m) + 'm ago';
  if (m < 1440) return Math.round(m / 60) + 'h ago';
  return Math.round(m / 1440) + 'd ago';
}
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ---------- streak: any study activity on a Brisbane calendar day counts ---------- */
function markActivity(){
  const t = todayKey(), s = store.get('streak', {last: null, count: 0, best: 0});
  if (s.last === t) return;
  // A streak freeze covers exactly one missed day (last activity the day before yesterday).
  const f = getFreeze(), frozen = s.last === addDays(t, -2) && f.n > 0;
  if (frozen){ f.n--; f.used = f.used.concat(addDays(t, -1)).slice(-50); store.set('freeze', f); }
  s.count = s.last === addDays(t, -1) || frozen ? s.count + 1 : 1;
  s.best = Math.max(s.best || 0, s.count); s.last = t;
  store.set('streak', s);
  const bonus = gainXP(10 + 2 * Math.min(10, s.count));
  if (bonus || frozen) setTimeout(() => toast(`${bonus ? `Daily bonus +${bonus} XP · ` : ''}${s.count} day streak${frozen ? ' · 🧊 streak freeze used' : ''}`), 1200);
  renderStats();
}
function currentStreak(){
  const s = store.get('streak', {last: null, count: 0}), t = todayKey();
  if (s.last === t || s.last === addDays(t, -1)) return s.count;
  return s.last === addDays(t, -2) && getFreeze().n > 0 ? s.count : 0; // a freeze will cover yesterday
}
/* ---------- streak freezes: earned by finishing every daily quest, max FREEZE_MAX banked ---------- */
const FREEZE_MAX = 2;
function getFreeze(){
  const f = store.get('freeze', null) || {};
  return {n: Number.isInteger(f.n) ? Math.max(0, Math.min(FREEZE_MAX, f.n)) : 0, used: Array.isArray(f.used) ? f.used : [], earned: typeof f.earned === 'string' ? f.earned : null};
}
// Returns 'earned', 'full' (already holding the max) or '' (already earned today).
function earnFreeze(){
  const f = getFreeze(), t = todayKey();
  if (f.earned === t) return '';
  f.earned = t; const full = f.n >= FREEZE_MAX; if (!full) f.n++;
  store.set('freeze', f);
  return full ? 'full' : 'earned';
}

/* ---------- activity log: XP per Brisbane day (sp_days), drawn as the profile heatmap ---------- */
const DAYS_KEEP = 400;
function getDays(){ const d = store.get('days', null); return d && typeof d === 'object' && !Array.isArray(d) ? d : null; }
function logDay(n){
  const d = getDays() || {}, t = todayKey();
  d[t] = (d[t] || 0) + n;
  const keys = Object.keys(d).sort();
  keys.slice(0, Math.max(0, keys.length - DAYS_KEEP)).forEach(k => delete d[k]);
  store.set('days', d);
}
// First run: rebuild which days had activity from what's already stored. XP per day wasn't kept, so those days log 1 ("active").
function seedDays(){
  if (getDays()) return;
  const d = {}, mark = k => { if (typeof k === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(k) && !d[k]) d[k] = 1; };
  const s = store.get('streak', null);
  if (s && s.last) for (let i = 0; i < Math.min(s.count || 0, DAYS_KEEP); i++) mark(addDays(s.last, -i));
  Object.values(store.get('lessons', {}) || {}).forEach(v => v && mark(v.date));
  const qh = store.get('quizHistory', []); if (Array.isArray(qh)) qh.forEach(h => h && mark(h.date));
  [store.get('qhist', {}) || {}, cardHist()].forEach(h => Object.values(h).forEach(r => r && mark(r.last)));
  const x = getXP(); if (x && x.today.xp) d[x.today.date] = x.today.xp;
  store.set('days', d);
}

/* ---------- XP + analyst rank: every study action (and reading the news) earns XP ---------- */
// Per-day caps stop farming: each question/card earns once a day, story reads cap at READ_CAP.
const XP = {right: 10, wrong: 3, pbqRight: 20, pbqWrong: 5, cardRight: 5, cardWrong: 1, lesson: 50, read: 2, exam: 25, quiz: 10};
const READ_CAP = 25;
const RANKS = [[1, 'Trainee Analyst'], [3, 'SOC Analyst (Tier 1)'], [6, 'SOC Analyst (Tier 2)'], [10, 'Incident Responder'],
  [15, 'Threat Hunter'], [20, 'Senior Analyst'], [25, 'Detection Engineer'], [30, 'SOC Lead'], [40, 'Security Architect'], [50, 'Cyber Legend']];
const SKILLS = () => (CYSA ? CYSA.domains.map(d => [String(d.id), d.name]) : []).concat([['intel', 'Threat Intel (news)']]);
// Level L -> L+1 costs step*L XP, so reaching level L takes step*L*(L-1)/2 in total.
const levelOf = (xp, step = 100) => Math.floor((1 + Math.sqrt(1 + 8 * Math.max(0, xp) / step)) / 2);
const xpForLevel = (L, step = 100) => step * L * (L - 1) / 2;
const rankOf = L => RANKS.filter(r => r[0] <= L).pop()[1];
function getXP(){
  const x = store.get('xp', null);
  if (!x || typeof x !== 'object' || typeof x.total !== 'number') return null;
  x.bySkill = x.bySkill && typeof x.bySkill === 'object' ? x.bySkill : {};
  const t = todayKey();
  if (!x.today || x.today.date !== t) x.today = {date: t, xp: 0, reads: 0, q: [], c: []};
  return x;
}
// First run: credit progress made before XP existed, so nobody starts back at level 1.
function seedXP(){
  if (store.get('xp', null) || !CYSA) return;
  const x = {total: 0, bySkill: {}, today: null};
  const add = (n, skill) => { x.total += n; x.bySkill[skill] = (x.bySkill[skill] || 0) + n; };
  const lessonDom = Object.fromEntries(CYSA.lessons.map(l => [l.id, String(l.domain)]));
  const cardDom = Object.fromEntries(CYSA.cards.map(c => [c.id, String(c.domain)]));
  Object.keys(store.get('lessons', {})).forEach(id => lessonDom[id] && add(XP.lesson, lessonDom[id]));
  Object.entries(store.get('qhist', {}) || {}).forEach(([qid, r]) => { const d = lessonDom[qid.split('#')[0]];
    if (d && r) add((r.right || 0) * XP.right + (r.wrong || 0) * XP.wrong, d); });
  Object.entries(cardHist()).forEach(([id, r]) => cardDom[id] && r && add((r.right || 0) * XP.cardRight + (r.wrong || 0) * XP.cardWrong, cardDom[id]));
  const reads = store.get('read', []);
  if (Array.isArray(reads)) add(reads.length * XP.read, 'intel');
  store.set('xp', x);
}
// Returns the XP actually awarded (0 if today's cap for this item is used up).
function gainXP(n, skill, once){
  const x = getXP(); if (!x || !n) return 0;
  if (once){ const [kind, id] = once; if (x.today[kind].includes(id)) return 0; x.today[kind].push(id); }
  const before = levelOf(x.total);
  x.total += n; x.today.xp += n;
  if (skill) x.bySkill[skill] = (x.bySkill[skill] || 0) + n;
  store.set('xp', x);
  const after = levelOf(x.total);
  if (after > before){
    const promo = rankOf(after) !== rankOf(before);
    setTimeout(() => toast(`Level up! Lv ${after}${promo ? ' · promoted to ' + rankOf(after) : ''}`), 300);
  }
  logDay(n);
  checkQuests();
  checkBadges();
  renderRank();
  return n;
}
function readXP(){
  const x = getXP(); if (!x || x.today.reads >= READ_CAP) return 0;
  x.today.reads++; store.set('xp', x);
  return gainXP(XP.read, 'intel');
}
const xpTag = n => n ? ` <span class="xp">+${n} XP</span>` : '';

/* ---------- daily quests: optional goals for bonus XP, reset on the Brisbane date, each paid once a day ---------- */
// Questions/cards count the unique ones answered today (sp_xp.today.q/.c), so repeats don't farm a quest either.
const QUESTS = [
  {id: 'q10', label: 'Answer 10 questions', goal: 10, xp: 30, n: x => x.today.q.length, go: () => show('learn')},
  {id: 'c10', label: 'Review 10 flashcards', goal: 10, xp: 30, n: x => x.today.c.length, go: () => show('cards')},
  {id: 'au3', label: 'Read 3 Australian stories', goal: 3, xp: 20, n: (x, s) => s.au.length, go: () => { newsFilter = 'au'; store.set('filter', 'au'); show('news'); }},
  {id: 'lesson', label: 'Finish a lesson', goal: 1, xp: 40, n: (x, s) => s.lessons.length,
    go: () => CYSA && openLesson((CYSA.lessons.find(l => !store.get('lessons', {})[l.id]) || CYSA.lessons[ordinal(todayKey()) % CYSA.lessons.length]).id)}
];
function getQuests(){
  const s = store.get('quests', null), t = todayKey();
  if (!s || typeof s !== 'object' || s.date !== t) return {date: t, au: [], lessons: [], done: []};
  ['au', 'lessons', 'done'].forEach(k => { if (!Array.isArray(s[k])) s[k] = []; });
  return s;
}
// kind: 'au' (Australian story opened today) or 'lessons' (lesson finished today).
function questTick(kind, id){
  const s = getQuests();
  if (!s[kind].includes(id)){ s[kind].push(id); store.set('quests', s); }
  checkQuests(); renderQuests();
}
let questBusy = false;
function checkQuests(){
  if (questBusy) return; // the bonus itself goes through gainXP, which calls back here
  const x = getXP(); if (!x) return;
  const s = getQuests(), fresh = QUESTS.filter(q => !s.done.includes(q.id) && q.n(x, s) >= q.goal);
  if (!fresh.length) return;
  s.done.push(...fresh.map(q => q.id)); store.set('quests', s);
  questBusy = true;
  try{ fresh.forEach(q => gainXP(q.xp)); }finally{ questBusy = false; }
  const all = QUESTS.every(q => s.done.includes(q.id)), fz = all ? earnFreeze() : '';
  setTimeout(() => toast(`Quest complete: ${fresh.map(q => q.label).join(', ')} +${fresh.reduce((a, q) => a + q.xp, 0)} XP${all ? ' · all done today!' : ''}${fz === 'earned' ? ' 🧊 Streak freeze earned' : ''}`), 1600);
  if (all) renderStats();
}
function renderQuests(){
  const el = $('#brief-quests'); if (!el) return;
  const x = getXP(); if (!x){ el.innerHTML = ''; return; }
  const s = getQuests(), nDone = QUESTS.filter(q => s.done.includes(q.id)).length;
  el.innerHTML = `<div class="card" id="quests"><div class="row small" style="margin-bottom:10px"><b class="grow">Daily quests</b><span class="muted">${nDone}/${QUESTS.length} done · resets at midnight</span></div>
    ${QUESTS.map(q => { const v = Math.min(q.goal, q.n(x, s)), done = s.done.includes(q.id);
      return `<button class="quest${done ? ' done' : ''}" data-q="${q.id}"><div class="row small"><span class="grow">${done ? '✓ ' : ''}${esc(q.label)}</span>
        <span class="muted">${v}/${q.goal}</span><span class="xp">+${q.xp} XP</span></div><div class="bar thin"><i style="width:${(v / q.goal * 100).toFixed(0)}%"></i></div></button>`; }).join('')}
    <div class="small muted" style="margin-top:8px">Optional bonus goals. Tap one to jump to it. Finish all ${QUESTS.length} to earn a 🧊 streak freeze (you have ${getFreeze().n}/${FREEZE_MAX}).</div></div>`;
  el.querySelectorAll('.quest').forEach(b => b.onclick = () => QUESTS.find(q => q.id === b.dataset.q).go());
}
/* ---------- achievements: one-off badges (sp_badges {id: date earned}), +BADGE_XP each ---------- */
const BADGE_XP = 25;
const BADGES = () => [
  {id: 'first-q', icon: '🎯', name: 'First answer', desc: 'Answer a quiz question', test: c => c.answered >= 1},
  {id: 'q250', icon: '🧠', name: 'Question bank', desc: 'Answer 250 quiz questions', test: c => c.answered >= 250},
  {id: 'cards100', icon: '🃏', name: 'Card shark', desc: 'Answer 100 flashcards', test: c => c.cards >= 100},
  {id: 'cards500', icon: '🗂️', name: 'Deck master', desc: 'Answer 500 flashcards', test: c => c.cards >= 500},
  {id: 'box5', icon: '🏛️', name: 'Long-term memory', desc: 'Get 25 cards to box 5', test: c => c.box5 >= 25},
  {id: 'streak7', icon: '🔥', name: 'On a roll', desc: 'Reach a 7-day streak', test: c => c.best >= 7},
  {id: 'streak30', icon: '☄️', name: 'Unstoppable', desc: 'Reach a 30-day streak', test: c => c.best >= 30},
  ...(CYSA ? CYSA.domains : []).map(d => ({id: 'dom' + d.id, icon: '🛡️', name: `Domain ${d.id} cleared`, desc: `Finish every ${d.name} lesson`,
    test: c => CYSA.lessons.filter(l => l.domain === d.id).every(l => c.lessons[l.id])})),
  {id: 'all-lessons', icon: '🎓', name: 'Syllabus cleared', desc: 'Finish every lesson', test: c => CYSA.lessons.every(l => c.lessons[l.id])},
  {id: 'pbq-perfect', icon: '🧩', name: 'Hands-on hero', desc: 'Get every PBQ right in a round', test: c => c.hist.some(h => h.type === 'pbq' && h.t >= 2 && h.c === h.t)},
  {id: 'exam-pass', icon: '📈', name: 'Pass mark', desc: 'Estimated 750+ on a practice exam', test: c => c.hist.some(h => h.type === 'exam' && h.t && scaledScore(h.c, h.t) >= PASS_MARK)},
  {id: 'beat-clock', icon: '⏱️', name: 'Beat the clock', desc: 'Estimated 750+ on a timed exam, inside the time', test: c => c.hist.some(h => h.type === 'exam' && h.timed && !h.expired && h.t && scaledScore(h.c, h.t) >= PASS_MARK)},
  {id: 'quests-all', icon: '✅', name: 'Quest master', desc: 'Finish every daily quest in a day', test: c => c.questsAll},
  {id: 'reader100', icon: '📰', name: 'Well informed', desc: 'Read 100 news stories', test: c => c.reads >= 100}
];
function badgeCtx(){
  const qs = store.get('qstats', {}) || {}, st = store.get('cards', {}) || {}, hist = store.get('quizHistory', []), reads = store.get('read', []), q = getQuests();
  return {answered: qs.answered || 0, cards: Object.values(cardHist()).reduce((a, r) => a + ((r && r.right) || 0) + ((r && r.wrong) || 0), 0),
    box5: Object.values(st).filter(v => v && v.box === 5).length, best: (store.get('streak', {}) || {}).best || 0,
    lessons: store.get('lessons', {}) || {}, hist: Array.isArray(hist) ? hist.filter(Boolean) : [],
    questsAll: QUESTS.every(x => q.done.includes(x.id)), reads: Array.isArray(reads) ? reads.length : 0};
}
function getBadges(){ const b = store.get('badges', null); return b && typeof b === 'object' && !Array.isArray(b) ? b : null; }
let badgeBusy = false;
function checkBadges(){
  if (badgeBusy || !CYSA) return;
  const prev = getBadges(), have = prev || {}, c = badgeCtx();
  const fresh = BADGES().filter(b => !have[b.id] && b.test(c));
  fresh.forEach(b => { have[b.id] = todayKey(); });
  if (fresh.length || !prev) store.set('badges', have);
  if (!fresh.length || !prev) return; // first run credits existing progress quietly, without XP

const HEAT_WEEKS = 17;
function heatmapHtml(){

}
function trendHtml(){
  const hist = store.get('quizHistory', []), rounds = (Array.isArray(hist) ? hist : []).filter(h => h && h.t > 0).slice(-20);
  if (rounds.length < 2) return `<div class="card small muted" id="trend-empty">Finish two or more quiz rounds to see your accuracy trend.</div>`;
  const W = 320, H = 120, L = 36, R = 8, T = 8, B = 16, pw = W - L - R, ph = H - T - B;
  const x = i => L + (rounds.length === 1 ? pw / 2 : i * pw / (rounds.length - 1)), y = p => T + ph * (1 - p / 100);
  const pcts = rounds.map(h => Math.round(h.c / h.t * 100)), avg = Math.round(pcts.reduce((a, b) => a + b, 0) / pcts.length);

  const grid = [0, 50, 80, 100].map(p => `<line x1="${L}" x2="${W - R}" y1="${y(p)}" y2="${y(p)}" style="stroke:var(--border)" stroke-width="1"${p === 80 ? ' stroke-dasharray="4 3"' : ''}/>
    <text x="${L - 6}" y="${y(p) + 4}" text-anchor="end" font-size="10" style="fill:var(--muted)">${p}%</text>`).join('');

  return `<div class="card small"><svg class="trend" id="trend" viewBox="0 0 ${W} ${H}" role="img" aria-label="Quiz accuracy over the last ${rounds.length} rounds, average ${avg}%">${grid}
    <polyline points="${pts}" fill="none" style="stroke:var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${dots}</svg>
    <div class="muted" style="margin-top:4px">Last ${rounds.length} rounds · average ${avg}% · latest ${pcts[pcts.length - 1]}% · dashed line = 80%, roughly exam-ready</div></div>`;
}

  while (d <= new Date() || d.getUTCHours() % 3) d.setUTCHours(d.getUTCHours() + 1);
  const m = Math.round((d - Date.now()) / 6e4);

function rank(i){ return i.score - Math.max(0, (Date.now() - Date.parse(i.published)) / 36e5) / 12; }

const RE = new Set(['Real estate', 'BEC / payment fraud']);

// Optional fields the pipeline may add: epss (0-1) and also ([{source, url}]). Render only when valid.
const isUrl = u => typeof u === 'string' && /^https?:\/\//i.test(u);
function epssOf(i){ return typeof i.epss === 'number' && isFinite(i.epss) && i.epss >= 0 && i.epss <= 1 ? i.epss : null; }
function epssPct(e){ const p = e * 100; return p < 1 ? '<1%' : Math.round(p) + '%'; }
function hostOf(u){ try{ return new URL(u).hostname; }catch(e){ return u; } }
function alsoOf(i){ return Array.isArray(i.also) ? i.also.filter(a => a && isUrl(a.url)) : []; }
// CVE IDs in a story link to NVD (skipping the one the headline already links to, e.g. KEV items).
const nvdUrl = c => 'https://nvd.nist.gov/vuln/detail/' + c;
function cvesOf(i){
  const found = ((i.title || '') + ' ' + (i.summary || '')).match(/\bCVE-\d{4}-\d{4,7}\b/gi) || [];
  return [...new Set(found.map(c => c.toUpperCase()))].filter(c => i.link !== nvdUrl(c)).slice(0, 3);
}
// KEV entries carry CISA's remediation due date in the summary ("CISA remediation due YYYY-MM-DD.", from fetch_news.py).
function kevDue(i){
  if (!(i.tags || []).includes('KEV')) return null;
  const m = /CISA remediation due (\d{4}-\d{2}-\d{2})/.exec(i.summary || '');
  return m ? m[1] : null;
}

}

/* ---------- mutes: hide a source or tag from Brief + News (never from Saved) ---------- */
function getMuted(){
  const m = store.get('muted', {}) || {};
  return {sources: Array.isArray(m.sources) ? m.sources : [], tags: Array.isArray(m.tags) ? m.tags : []};
}
function isMuted(i, m = getMuted()){ return m.sources.includes(i.source) || (i.tags || []).some(t => m.tags.includes(t)); }
function toggleMute(kind, val){
  const m = getMuted(), list = m[kind], k = list.indexOf(val);
  if (k >= 0) list.splice(k, 1); else list.push(val);
  store.set('muted', m);
  return k < 0; // true = now muted

/* ---------- "why this ranked": rebuild the fetcher's score from scripts/sources.json ---------- */
let SOURCES_CFG = null;
async function loadSourcesCfg(){
  if (SOURCES_CFG) return SOURCES_CFG;
  try{ const r = await fetch('scripts/sources.json?_=' + Date.now()); if (r.ok) SOURCES_CFG = await r.json(); }catch(e){}
  return SOURCES_CFG;
}
// Mirrors score() in fetch_news.py: source weight + each matched group (weight, +1 if in the headline) + 2 if Australian.
function explainScore(i, cfg){
  const rows = [], matched = new Set();
  const hay = (' ' + i.title + ' ' + (i.summary || '') + ' ').toLowerCase(), head = (' ' + i.title + ' ').toLowerCase();
  const src = (cfg.sources || []).find(s => s.name === i.feed);
  rows.push({label: 'Source weight · ' + (i.feed || i.source), pts: src ? (src.weight || 0) : 0});
  (cfg.keywords || []).forEach(g => {
    const hits = (g.terms || []).filter(t => hay.includes(t));
    if (!hits.length) return;
    const inTitle = g.terms.some(t => head.includes(t));
    rows.push({label: g.tag, pts: (g.weight || 0) + (inTitle ? 1 : 0), terms: hits, inTitle});
    matched.add(g.tag);
  });
  if (i.region === 'AU') rows.push({label: 'Australian story bonus', pts: 2});
  // Mirrors EPSS_BUMP in fetch_news.py: +2 for non-KEV items with EPSS >= 50% (applied when the story was first fetched).
  if (epssOf(i) !== null && i.epss >= 0.5 && !(i.tags || []).includes('KEV')) rows.push({label: 'High EPSS bonus (' + epssPct(i.epss) + ')', pts: 2});
  const fromFeed = (i.tags || []).filter(t => !matched.has(t) && !(t === 'Australia' && i.region === 'AU'));
  return {rows, fromFeed, total: rows.reduce((a, r) => a + r.pts, 0)};
}

// Domains with fewer than FOCUS_MIN answers count as 0% (not practised yet), so the heaviest unpractised domain comes first.
const FOCUS_MIN = 5, DRILL_N = 10;

  if (!CYSA) return null;

}

// sp_backup {last: date of last export, snooze: date the nudge stays hidden until}.
const BACKUP_DAYS = 30, BACKUP_SNOOZE = 7;
let storagePersisted = null;
async function persistStorage(){
  try{ if (navigator.storage && navigator.storage.persist) storagePersisted = await navigator.storage.persisted() || await navigator.storage.persist(); }catch(e){}
}
function getBackup(){ const b = store.get('backup', null); return b && typeof b === 'object' ? b : {}; }
function backupAgo(){ const b = getBackup(); if (!b.last) return 'never'; const d = ordinal(todayKey()) - ordinal(b.last); return d <= 0 ? 'today' : d === 1 ? 'yesterday' : d + ' days ago'; }
function backupDue(){
  const x = getXP(), b = getBackup(), t = todayKey();
  if (!x || x.total < 100) return false; // nothing much to lose yet
  if (b.snooze && b.snooze > t) return false;
  return !b.last || ordinal(t) - ordinal(b.last) >= BACKUP_DAYS;
}
function exportBackup(){
  const data = {};
  try{ for (let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); if (k.startsWith('sp_')) data[k] = localStorage.getItem(k); } }catch(e){}
  data.sp_backup = JSON.stringify({last: todayKey()}); // the backup file remembers it was a backup
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data)], {type: 'application/json'}));
  a.download = 'sec-pulse-backup-' + todayKey() + '.json'; a.click();
  store.set('backup', {last: todayKey()});
  toast('Backup saved - keep the file somewhere safe');
}

    <div class="row" style="gap:8px"><button class="btn primary" id="backup-now">Export backup</button><button class="btn" id="backup-later">Remind me later</button></div></div>`;
  $('#backup-now').onclick = () => { exportBackup(); renderBackup(); };

/* ---------- Quiz engine ---------- */
function recordAnswer(q, correct){
  const s = store.get('qstats', {answered: 0, correct: 0, byDomain: {}});
  s.answered++; if (correct) s.correct++;
  const d = s.byDomain[q.domain] || (s.byDomain[q.domain] = {a: 0, c: 0});
  d.a++; if (correct) d.c++;
  store.set('qstats', s);
  if (q.qid){
    // Per-question history for "Review mistakes". ok = was the latest answer right.
    let h = store.get('qhist', {}); if (!h || typeof h !== 'object' || Array.isArray(h)) h = {};
    const r = h[q.qid] || {right: 0, wrong: 0};
    if (correct) r.right++; else r.wrong++;
    r.last = todayKey(); r.ok = !!correct; h[q.qid] = r;
    store.set('qhist', h);
  }
  markActivity();

// Questions to review: latest answer wrong, or wrong more often than right. Latest-wrong first, then most net misses, then most recent.
function weakQuestions(){
  if (!CYSA) return [];
  const h = store.get('qhist', {}) || {};
  return ALL_Q().concat(ALL_PBQ()).filter(q => { const r = h[q.qid]; return r && r.wrong > 0 && (!r.ok || r.wrong > r.right); })
    .sort((a, b) => { const x = h[a.qid], y = h[b.qid];
      return (!!x.ok - !!y.ok) || ((y.wrong - y.right) - (x.wrong - x.right)) || String(y.last || '').localeCompare(String(x.last || '')); });
}
// opts.timeLimit (seconds): countdown via opts.onTick(secondsLeft); at zero the round ends and unanswered questions count as wrong.
// Closing the sheet abandons a timed round (nothing is recorded).
const mmss = sec => { sec = Math.max(0, Math.round(sec)); return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); };
function renderQuiz(root, questions, opts = {}){
  let idx = 0, correct = 0, nAnswered = 0, timer = null, ended = false;
  const t0 = Date.now(), used = () => Math.min(opts.timeLimit || Infinity, (Date.now() - t0) / 1000);
  const show = () => {
    const q = questions[idx];
    const where = q.lesson ? ' · lesson ' + esc(q.lesson) : q.pbq ? ' · PBQ · domain ' + esc(q.domain) : '';
    const head = `${questions.length > 1 ? `<div class="q-progress">Question ${idx + 1} of ${questions.length}${where}</div>` : ''}
      <div class="q-text">${esc(q.q)}</div>${q.exhibit ? `<pre class="exhibit" tabindex="0" aria-label="Exhibit">${esc(q.exhibit)}</pre>` : ''}`;
    if (q.type === 'order') return showOrder(q, head);
    const order = shuffle(q.options.map((o, i) => i)); // options are shuffled every time
    root.innerHTML = `${head}${order.map(i => `<button class="opt" data-i="${i}">${esc(q.options[i])}</button>`).join('')}
      <div class="explain" hidden></div><div class="q-next"></div>`;
    root.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      const pick = +b.dataset.i, ok = pick === q.answer;
      root.querySelectorAll('.opt').forEach(o => {
        o.disabled = true;
        if (+o.dataset.i === q.answer) o.classList.add('correct');
        else if (+o.dataset.i === pick) o.classList.add('wrong');
      });
      answered(q, ok);
    });
  };
  // Order PBQ: `items` are stored in the correct order, shown shuffled, moved with ▲/▼ (no drag, touch-friendly), then checked.
  const showOrder = (q, head) => {
    const n = q.items.length;
    let cur = shuffle(q.items.map((_, i) => i)), checked = false;
    for (let k = 0; k < 6 && cur.every((v, i) => v === i); k++) cur = shuffle(cur);
    root.innerHTML = `${head}<div class="small muted" style="margin:-4px 0 8px">Put these in order, first at the top. ▲ ▼ move an item one step.</div>
      <ol class="order-list"></ol><button class="btn primary block order-check">Check order</button>
      <div class="explain" hidden></div><div class="q-next"></div>`;
    const list = root.querySelector('.order-list');
    const draw = focusPos => {
      list.innerHTML = cur.map((it, pos) => `<li class="order-item${checked ? (it === pos ? ' correct' : ' wrong') : ''}" data-i="${it}">
        <span class="n">${pos + 1}</span><span class="t">${esc(q.items[it])}</span>
        ${checked ? '' : `<button class="mv" data-pos="${pos}" data-d="-1" aria-label="Move up" ${pos === 0 ? 'disabled' : ''}>▲</button>
          <button class="mv" data-pos="${pos}" data-d="1" aria-label="Move down" ${pos === n - 1 ? 'disabled' : ''}>▼</button>`}</li>`).join('');
      list.querySelectorAll('.mv').forEach(b => b.onclick = () => {
        const p = +b.dataset.pos, d = +b.dataset.d, t = p + d;
        if (t < 0 || t >= n) return;
        [cur[p], cur[t]] = [cur[t], cur[p]]; draw([t, d]);
      });
      // Keep focus on the moved item's button so keyboard / switch users can keep moving it.
      if (focusPos){ const b = list.querySelector(`.mv[data-pos="${focusPos[0]}"][data-d="${focusPos[1]}"]:not(:disabled)`) || list.querySelector(`.mv[data-pos="${focusPos[0]}"]:not(:disabled)`); b && b.focus(); }
    };
    draw();
    root.querySelector('.order-check').onclick = e => {
      checked = true; e.currentTarget.remove(); draw();
      const right = cur.filter((it, pos) => it === pos).length, ok = right === n;
      answered(q, ok, ok ? '' : `${right} of ${n} in the right place. `,
        ok ? '' : `<div style="margin-top:8px"><b>Correct order</b><ol class="points" style="margin:4px 0 0">${q.items.map(t => `<li>${esc(t)}</li>`).join('')}</ol></div>`);
    };
  };
  const answered = (q, ok, pre = '', post = '') => {
    if (ended) return;
    nAnswered++; if (ok) correct++;
    const xp = recordAnswer(q, ok);
    const ex = root.querySelector('.explain'); ex.hidden = false;
    ex.innerHTML = `<b style="color:${ok ? 'var(--ok)' : 'var(--danger)'}">${ok ? 'Correct.' : 'Not quite.'}</b>${xpTag(xp)} ${esc(pre)}${esc(q.explain)}${post}`;
    if (opts.single) return;
    const last = idx === questions.length - 1;
    const nb = document.createElement('button');
    nb.className = 'btn primary block'; nb.textContent = last ? 'See result' : 'Next';
    nb.onclick = () => { if (last) finish(); else { idx++; show(); } };
    root.querySelector('.q-next').appendChild(nb);
  };
  const finish = (expired = false) => {
    if (ended) return; ended = true; clearInterval(timer);
    const pct = Math.round(correct / questions.length * 100);
    // Rough guide only: CySA+ is scaled 100-900, pass 750. ~80%+ on practice sets is a good sign.
    const msg = pct >= 80 ? 'Exam-ready territory on this set.' : pct >= 65 ? 'Close - review the misses.' : 'Keep going - revisit the lessons for the domains you missed.';
    root.innerHTML = `<div style="text-align:center;padding:10px 0"><div style="font-size:40px;font-weight:800;color:var(--accent)">${pct}%</div>
      <div>${correct} of ${questions.length} correct</div><div class="muted small" style="margin-top:6px">${msg}</div>
      ${opts.timeLimit ? `<div class="small" id="time-used" style="margin-top:8px">${expired ? `⏱ Time's up - ${questions.length - nAnswered} unanswered counted as wrong` : `⏱ Time used ${mmss(used())} of ${mmss(opts.timeLimit)}`}</div>` : ''}</div>`;
    opts.onDone && opts.onDone(correct, questions.length, opts.timeLimit ? {secs: Math.round(used()), expired} : null);
  };
  if (opts.timeLimit){
    const tick = () => {
      if (ended) return;
      if (!root.isConnected || !$('#sheet').classList.contains('open')){ clearInterval(timer); ended = true; return; }
      const left = opts.timeLimit - (Date.now() - t0) / 1000;
      opts.onTick && opts.onTick(Math.max(0, left));
      if (left <= 0) finish(true);
    };
    timer = setInterval(tick, 1000); tick();
  }
  show();
}
// Practice exam -> rough 100-900 estimate. A straight line from 0% = 100 to 100% = 900 (so 750 ≈ 81%), rounded to 10.
// CompTIA doesn't publish its conversion, so this is deliberately simple and labelled as a guide.
const PASS_MARK = 750;
const scaledScore = (c, t) => Math.round((100 + 800 * c / t) / 10) * 10;
function scaledHtml(c, t){
  const sc = scaledScore(c, t);
  return `<div class="scaled" id="scaled"><div class="small muted">Rough scaled estimate</div>
    <div><b style="color:${sc >= PASS_MARK ? 'var(--ok)' : 'var(--warn)'}">≈ ${sc}</b> <span class="muted">/ 900 · pass ${PASS_MARK}</span></div>
    <div class="small muted" style="margin-top:6px">Rough guide only. CompTIA doesn't publish how raw scores convert to its 100-900 scale, and the real exam adds PBQs, unscored items and different question weights. This simply maps 0% to 100 and 100% to 900 in a straight line.</div></div>`;
}

/* ---------- Flashcards: multiple choice + Leitner boxes 1-5 ---------- */
const INTERVALS = [0, 1, 3, 7, 14, 30]; // days until next review, by box
const NEW_PER_DAY = 8;
function dueCards(){
  const st = store.get('cards', {}), t = todayKey();
  const due = CYSA.cards.filter(c => st[c.id] && st[c.id].due <= t);
  const nd = store.get('newToday', {date: null, n: 0});
  const newLeft = Math.max(0, NEW_PER_DAY - (nd.date === t ? nd.n : 0));
  return due.concat(CYSA.cards.filter(c => !st[c.id]).slice(0, newLeft));
}
function cardHist(){ const h = store.get('cardhist', {}); return h && typeof h === 'object' && !Array.isArray(h) ? h : {}; }
// Cards to revisit: latest answer wrong, or wrong more often than right. Same rule as weakQuestions().
function missedCards(){
  if (!CYSA) return [];
  const h = cardHist();
  return CYSA.cards.filter(c => { const r = h[c.id]; return r && r.wrong > 0 && (!r.ok || r.wrong > r.right); })
    .sort((a, b) => { const x = h[a.id], y = h[b.id];
      return (!!x.ok - !!y.ok) || ((y.wrong - y.right) - (x.wrong - x.right)) || String(y.last || '').localeCompare(String(x.last || '')); });
}
// Hide a card's own identifiers (ports, flags, event IDs, acronyms) in its answer text, so options can't be matched by number.
function cardKeys(c){ return (c.front.match(/-{1,2}[A-Za-z][\w-]*|\b\d{2,5}\b|\b[A-Z]{2,}\b/g) || []).filter(k => k !== 'ID').sort((a, b) => b.length - a.length); }
function maskBack(c){
  return cardKeys(c).reduce((s, k) => s.replace(new RegExp('(^|[^\\w-])' + k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?![\\w-])', 'g'), '$1___'), c.back);
}
// Three wrong answers from the same topic group (cysa.json `group`, e.g. frameworks, ports, event IDs), so options look alike.
// Fallbacks (only if a group is too small): same domain but not another group's ports/flags/IDs, then anything.
const ID_GROUPS = ['nmap', 'port', 'event-id'];
function cardOptions(c){
  const others = shuffle(CYSA.cards.filter(o => o.id !== c.id && o.back !== c.back));
  const picks = [];
  for (const pool of [others.filter(o => c.group && o.group === c.group), others.filter(o => o.domain === c.domain && !ID_GROUPS.includes(o.group)), others])
    for (const o of pool) if (picks.length < 3 && !picks.includes(o)) picks.push(o);
  return shuffle([c, ...picks]);
}
let cardQueue = null, cardShown = null, cardRound = null;
function startCardRound(cards, mode){ cardQueue = cards.map(c => ({...c, mode})); cardShown = null; cardRound = mode; renderCards(); }
function renderCards(){

  if (cardRound && cardQueue && !cardQueue.length){ toast(cardRound === 'review' ? 'Missed-card review done' : cardRound === 'acronyms' ? 'Acronym drill done' : 'Cram done'); cardRound = null; cardQueue = null; }
  if (!cardQueue) cardQueue = shuffle(dueCards()).map(c => ({...c}));
  const st = store.get('cards', {}), missed = missedCards().length;
  const boxes = [1, 2, 3, 4, 5].map(b => CYSA.cards.filter(c => st[c.id] && st[c.id].box === b).length);
  const unseen = CYSA.cards.filter(c => !st[c.id]).length;
  const acro = CYSA.cards.filter(x => x.group === 'acronym');
  const reviewBtn = `<button class="btn block" id="card-review">Review missed cards${missed ? ' · ' + missed : ''}</button>`
    + (acro.length ? `<button class="btn block" id="card-acro" style="margin-top:8px">Acronym drill · 10 of ${acro.length}</button>` : '');
  const summary = `<div class="boxes">${boxes.map((n, i) => `<div><b>${n}</b>box ${i + 1}</div>`).join('')}<div><b>${unseen}</b>new</div></div>
    <p class="small muted">New cards: ${NEW_PER_DAY}/day. Pick the answer: right → next box, wrong → box 1 and you'll be asked again later in the round. Missed cards stay in "Review missed cards" until you get them right more often than wrong. Box 5 cards come back every 30 days.</p>`;
  const wireReview = () => { $('#card-review').onclick = () => {
    const m = missedCards();
    if (!m.length){ toast('No missed cards yet'); return; }
    startCardRound(shuffle(m.slice(0, 10)), 'review');
  };
    const ab = $('#card-acro'); if (ab) ab.onclick = () => startCardRound(shuffle(acro).slice(0, 10), 'acronyms'); };
  if (!cardQueue.length){
    area.innerHTML = `<div class="card flash"><div class="front">All caught up ✓</div><div class="muted" style="margin-top:8px">Come back tomorrow for more cards.</div></div>
      ${reviewBtn}<button class="btn block" id="cram" style="margin-top:8px">Cram 10 random cards (doesn't affect schedule)</button>${summary}`;
    $('#cram').onclick = () => startCardRound(shuffle(CYSA.cards).slice(0, 10), 'cram');
    wireReview(); renderStats(); return;
  }
  const c = cardQueue[0], dom = CYSA.domains.find(d => d.id === c.domain), h = cardHist()[c.id];
  // Keep the same options if we re-render the same card (e.g. switching tabs mid-card).
  if (!cardShown || cardShown.id !== c.id || cardShown.q !== c) cardShown = {id: c.id, q: c, opts: cardOptions(c)};
  const label = c.mode === 'review' ? ' · missed cards' : c.mode === 'cram' ? ' · cram' : c.mode === 'acronyms' ? ' · acronyms' : '';
  const past = h && h.wrong ? `<div class="small muted" style="margin-top:8px">Missed ${h.wrong}× before${h.ok ? '' : ' · last time wrong'}</div>` : '';
  area.innerHTML = `<div class="row small muted" style="margin-bottom:8px"><span class="grow">${cardQueue.length} left${label}</span><span>Domain ${dom.id} · ${esc(dom.name)}</span></div>
    <div class="card" id="flash" data-card="${esc(c.id)}"><div class="flash-front">${esc(c.front)}</div>${past}
      <div class="small muted" style="margin:10px 0 8px">Pick the matching answer</div>
      ${cardShown.opts.map(o => `<button class="opt" data-id="${esc(o.id)}">${esc(maskBack(o))}</button>`).join('')}
      <div class="explain" hidden></div></div>
    <div id="card-next"></div>
    ${c.mode === 'review' || c.mode === 'acronyms' ? '' : reviewBtn}${summary}`;
  if (c.mode !== 'review' && c.mode !== 'acronyms') wireReview();
  area.querySelectorAll('#flash .opt').forEach(b => b.onclick = () => {
    const ok = b.dataset.id === c.id;
    area.querySelectorAll('#flash .opt').forEach(o => {
      o.disabled = true;
      if (o.dataset.id === c.id) o.classList.add('correct'); else if (o === b) o.classList.add('wrong');
    });
    const improved = ok && h && h.wrong > 0 && !h.ok;
    const ex = $('#flash .explain'); ex.hidden = false;
    ex.innerHTML = `<b style="color:${ok ? 'var(--ok)' : 'var(--danger)'}">${ok ? (improved ? 'Improved! ✓' : 'Correct.') : 'Not quite.'}</b> ${esc(c.back)}`
      + (ok ? '' : `<div class="small" style="margin-top:6px">Saved to your missed cards - you'll see it again${c.retried ? ' next time' : ' later in this round'}.</div>`);
    const xp = answerCard(c, ok);
    if (xp) ex.querySelector('b').insertAdjacentHTML('afterend', xpTag(xp));
    const nb = document.createElement('button');
    nb.className = 'btn primary block'; nb.id = 'card-next-btn'; nb.textContent = cardQueue.length ? 'Next card' : 'Done';
    nb.onclick = renderCards;
    $('#card-next').appendChild(nb);
  });
}
function answerCard(c, ok){
  cardQueue.shift();
  const h = cardHist(), t = todayKey(), r = h[c.id] || {right: 0, wrong: 0};
  if (ok) r.right++; else r.wrong++;
  r.last = t; r.ok = ok; h[c.id] = r;
  store.set('cardhist', h);
  if (!c.mode){
    const st = store.get('cards', {});
    if (!st[c.id]){ const nd = store.get('newToday', {date: null, n: 0}); store.set('newToday', {date: t, n: nd.date === t ? nd.n + 1 : 1}); }
    const prev = st[c.id] ? st[c.id].box : 0;
    const box = ok ? Math.min(5, Math.max(1, prev + 1)) : 1;
    st[c.id] = {box, due: ok ? addDays(t, INTERVALS[box]) : t};
    store.set('cards', st);
  }
  // Wrong: ask once more at the end of this round (fresh options), then it waits in "Review missed cards".
  if (!ok && !c.retried) cardQueue.push({...c, retried: true});
  markActivity(); renderStats();
  return gainXP(ok ? XP.cardRight : XP.cardWrong, String(c.domain), ['c', c.id]);
}

/* ---------- What's new / Roadmap: render the repo's own Markdown (headings, bullets, checkboxes, bold, code) ---------- */
function miniMd(src){
  const inline = t => esc(t).replace(/\[([^\]]+)\]\([^)]*\)/g, '$1').replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>');
  let html = '', inList = false;
  const close = () => { if (inList){ html += '</ul>'; inList = false; } };
  src.split('\n').forEach(line => {
    const h = line.match(/^#{1,3}\s+(.*)/), li = line.match(/^\s*[-*]\s+(\[( |x)\]\s+)?(.*)/i);
    if (h){ close(); if (!/^#\s/.test(line)) html += `<h3>${inline(h[1])}</h3>`; }
    else if (li){ if (!inList){ html += '<ul>'; inList = true; }
      html += li[1] ? `<li class="${li[2].toLowerCase() === 'x' ? 'done' : 'todo'}">${li[2].toLowerCase() === 'x' ? '✅' : '⬜'} ${inline(li[3])}</li>` : `<li>${inline(li[3])}</li>`; }
    else if (line.trim()){ close(); html += `<p class="small muted">${inline(line)}</p>`; }
  });
  close();
  return html;
}
async function openDoc(title, path){
  openSheet(title, '<div class="empty">Loading…</div>');
  try{
    const r = await fetch(path + '?_=' + Date.now());
    if (!r.ok) throw new Error(r.status);
    $('#sheet-body').innerHTML = `<div class="card md">${miniMd(await r.text())}</div>`;
  }catch(e){ $('#sheet-body').innerHTML = '<div class="empty">Couldn\'t load this (offline?).</div>'; }
}

/* ---------- Web Push: the brief arrives as a notification from this app, and tapping it opens the app ---------- */
// Public half of the VAPID key pair; the private half is the VAPID_PRIVATE_KEY Actions secret used by send_brief.py.
// iPhone only allows web notifications for the Home Screen app (iOS 16.4+), not Safari tabs.
const VAPID_PUBLIC = 'BN2kYewkiWEd45jtQutWHWD2ux09hsADilE1iJ6PNo-q2ZEjOaw46OSgH3qJJ2AeLhOpUzNVH02WJlKIZE5C0F4';
const pushSupported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
function b64urlBytes(s){ const b = atob((s + '='.repeat((4 - s.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(b, c => c.charCodeAt(0)); }
async function pushSub(){ try{ return await (await navigator.serviceWorker.ready).pushManager.getSubscription(); }catch(e){ return null; } }
async function enablePush(){
  try{
    // requestPermission must be the first await after the tap, or iOS ignores it.
    if (await Notification.requestPermission() !== 'granted'){ toast('Notifications not allowed'); return renderPush(); }
    const reg = await navigator.serviceWorker.ready;
    await reg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: b64urlBytes(VAPID_PUBLIC)});
    toast('Notifications on - now copy the code to GitHub');
  }catch(e){ toast("Couldn't turn on notifications"); }
  renderPush();
}
async function renderPush(){
  const el = $('#push-card'); if (!el) return;
  if (!pushSupported()){
    el.innerHTML = /iphone|ipad|ipod/i.test(navigator.userAgent) && !standalone
      ? '<span class="muted">Open Sec-Pulse from its Home Screen icon to turn these on. iPhone only allows notifications for Home Screen apps.</span>'
      : '<span class="muted">This browser doesn\'t support web notifications.</span>';
    return;
  }
  if (Notification.permission === 'denied'){ el.innerHTML = '<span class="muted">Notifications are blocked. Allow them in iPhone Settings → Notifications → Sec-Pulse, then come back here.</span>'; return; }
  const sub = await pushSub();
  if (!sub){
    el.innerHTML = `<p style="margin-top:0">Get the morning brief and weekly digest as notifications from this app. Tapping one opens Sec-Pulse.</p>
      <button class="btn primary" id="push-on">Turn on notifications</button>`;
    $('#push-on').onclick = enablePush;
    return;
  }
  const code = JSON.stringify(sub.toJSON());
  el.innerHTML = `<p style="margin-top:0">✅ On for this phone. One-time step: copy this code into GitHub so the brief can reach this phone.</p>
    <textarea class="field" id="push-code" readonly rows="3" aria-label="Notification code" style="font-size:12px">${esc(code)}</textarea>
    <div class="row wrap" style="gap:8px;margin-top:8px"><button class="btn primary" id="push-copy">Copy code</button>
      <button class="btn" id="push-test">Test</button><button class="btn" id="push-off">Turn off</button></div>
    <ol style="padding-left:18px;margin:10px 0 0">
      <li>GitHub repo <b>Settings → Secrets and variables → Actions → New repository secret</b>.</li>
      <li>Name <code>WEBPUSH_SUBSCRIPTION</code>, secret = the code above.</li>
      <li>Check it: <b>Actions → Morning brief → Run workflow</b>.</li></ol>
    <p class="muted" style="margin-bottom:0">If you turn this off or reinstall the app, the code changes: update the secret with the new one.</p>`;
  $('#push-copy').onclick = async () => {
    try{ await navigator.clipboard.writeText(code); toast('Code copied'); }
    catch(e){ const t = $('#push-code'); t.focus(); t.select(); toast('Select all and copy'); }
  };
  $('#push-test').onclick = async () => {
    try{ (await navigator.serviceWorker.ready).showNotification('Sec-Pulse', {body: 'Notifications work. Tap to open the app.', tag: 'test', icon: 'assets/icons/icon-192.png?v=1', data: {url: new URL('./#brief', location.href).href}}); }
    catch(e){ toast("Couldn't show a notification"); }
  };
  $('#push-off').onclick = async () => { try{ await sub.unsubscribe(); toast('Notifications off'); }catch(e){} renderPush(); };
}

/* ---------- pull to refresh on News: drag down at the very top, reuses loadNews(true) ---------- */
// Listeners sit on the News view only. Sideways swipes (filter chips) and upward scrolls are left alone;
// preventDefault only happens once a downward pull from scrollY 0 is under way (it stops the rubber-band).
(() => {
  const view = $('#view-news'), el = $('#ptr'), label = el.querySelector('span'), TH = 60, MAX = 90;
  let y0 = null, x0 = 0, pull = 0, pulling = false, busy = false;
  const set = h => { el.style.height = h + 'px'; };
  view.addEventListener('touchstart', e => {
    y0 = null;
    if (busy || e.touches.length !== 1 || window.scrollY > 0 || $('#sheet').classList.contains('open')) return;
    y0 = e.touches[0].clientY; x0 = e.touches[0].clientX; pull = 0; pulling = false;
  }, {passive: true});
  view.addEventListener('touchmove', e => {
    if (y0 === null) return;
    const dy = e.touches[0].clientY - y0, dx = e.touches[0].clientX - x0;
    if (!pulling){
      if (dy < -6 || Math.abs(dx) > Math.max(8, dy) || window.scrollY > 0){ y0 = null; return; }
      if (dy < 8) return;
      pulling = true; el.classList.remove('anim');
    }
    if (e.cancelable) e.preventDefault();
    pull = Math.min(MAX, Math.max(0, dy - 8) * 0.55);
    set(pull); el.classList.toggle('ready', pull >= TH);
    label.textContent = pull >= TH ? 'Release to refresh' : 'Pull to refresh';
  }, {passive: false});
  const end = async () => {
    const was = pulling; y0 = null; pulling = false;
    if (!was) return;
    el.classList.add('anim'); el.classList.remove('ready');
    if (pull < TH){ set(0); return; }
    busy = true; set(46); el.classList.add('busy'); label.textContent = 'Refreshing…';
    try{ await loadNews(true); }finally{
      el.classList.remove('busy'); set(0); label.textContent = 'Pull to refresh'; busy = false;
    }
  };
  view.addEventListener('touchend', end); view.addEventListener('touchcancel', end);
})();
