name: Fetch news

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and score feeds
        run: python3 scripts/fetch_news.py
      - name: Commit news.json if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update news feed"
          # Another workflow pushed news.json meanwhile: every copy differs (`generated`), so don't fight it.
          # The next run (3h) fetches again.
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push || { git rebase --abort 2>/dev/null; echo "news.json changed upstream; skipping this commit"; exit 0; }
