name: Morning brief

on:
  schedule:
    - cron: "25 21 * * *"   # 21:25 UTC = 7:25am Brisbane (AEST, no daylight saving)
  workflow_dispatch:
    inputs:
      once:
        description: "Skip if today's brief was already sent (the external scheduler sets this)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: news-data
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch fresh news first
        run: python3 scripts/fetch_news.py
      - name: Commit news.json if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update news feed (morning brief)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
      - name: Install Web Push library
        # The one non-stdlib dependency, used only for Web Push to the Home Screen app. If PyPI is down,
        # ntfy still sends and the Web Push error fails the run visibly.
        continue-on-error: true
        run: pip install --quiet pywebpush==2.5.0
      - name: Send push notification
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          WEBPUSH_SUBSCRIPTION: ${{ secrets.WEBPUSH_SUBSCRIPTION }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        # Scheduled and external-scheduler runs pass --once, so only the first one each day sends.
        run: python3 scripts/send_brief.py ${{ (github.event_name == 'schedule' || inputs.once) && '--once' || '' }}
      - name: Record that today's brief was sent
        run: |
          git add data/brief-sent.txt 2>/dev/null || exit 0
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Morning brief sent"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
