name: Weekly digest

on:
  schedule:
    - cron: "0 8 * * 0"   # Sunday 08:00 UTC = Sunday 6pm Brisbane (AEST, no daylight saving)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-data
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch fresh news first
        continue-on-error: true   # if the fetch breaks, send the digest from the last committed news
        run: python3 scripts/fetch_news.py
      - name: Commit news.json if it changed
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update news feed (weekly digest)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
      - name: Install Web Push library
        # The one non-stdlib dependency, used only for Web Push to the Home Screen app. If PyPI is down,
        # ntfy still sends and the Web Push error fails the run visibly.
        continue-on-error: true
        run: pip install --quiet pywebpush==2.5.0
      - name: Send push notification
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          WEBPUSH_SUBSCRIPTION: ${{ secrets.WEBPUSH_SUBSCRIPTION }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python3 scripts/send_digest.py
